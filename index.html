<!DOCTYPE html>
<html lang="de">
<head>

<style>
body {
    margin: 0;
    background: transparent;
}

.container {
    display: inline-flex;
    flex-direction: row;
    align-items: center;
    gap: 20px;
    font-family: Arial, Helvetica, sans-serif;
}

.text1, .text2 {
    font-size: 36px;
    font-weight: 900;
    color: #D4DCE8;

</head>
<body>

<div class="container">
    <div class="text1">FRA/EDDF</div>
    <div class="text2">Flughafen Frankfurt</div>
</div>

</body>
</html>
